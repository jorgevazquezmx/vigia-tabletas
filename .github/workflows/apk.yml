name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Llave de firma (se crea una sola vez y se guarda en el repositorio)
        run: |
          if [ ! -f firma/vigia.jks.b64 ]; then
            mkdir -p firma
            keytool -genkeypair -keystore $RUNNER_TEMP/vigia.jks -alias vigia -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Vigia, O=Grupo Calpulli Miztli, C=MX"
            base64 -w 76 $RUNNER_TEMP/vigia.jks > firma/vigia.jks.b64
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add firma/vigia.jks.b64; git commit -m "Llave de firma de la app [skip ci]"; git push
          fi
          base64 -d firma/vigia.jks.b64 > $RUNNER_TEMP/vigia.jks
      - name: Icono
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d##*:}; mkdir -p app/src/main/res/mipmap-${d%%:*}
            convert -size ${n}x${n} xc:'#0f2a44' -fill '#ffffff' -gravity center -pointsize $((n*62/100)) -annotate +0+0 'V' app/src/main/res/mipmap-${d%%:*}/ic_launcher.png
          done
      - name: Compilar
        env:
          KS_PATH: ${{ runner.temp }}/vigia.jks
          KS_PASS: android
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Vigia-${{ github.run_number }}.apk
      - name: Copia del APK en el repositorio (para pasarla sin iniciar sesión)
        run: |
          mkdir -p apk && base64 -w 0 Vigia-${{ github.run_number }}.apk > apk/Vigia.apk.b64
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git pull --rebase -q || true
          git add apk/Vigia.apk.b64 && git commit -m "APK ${{ github.run_number }} [skip ci]" && git push || true
      - uses: actions/upload-artifact@v4
        with: { name: Vigia-apk, path: 'Vigia-*.apk' }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vigía Android 1.0.${{ github.run_number }}
          files: Vigia-${{ github.run_number }}.apk
